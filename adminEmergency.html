<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emergency Requests</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fefefe;
      padding: 40px;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: #8b0000;
      margin-bottom: 30px;
    }

    .table-container {
      background: #ffffff;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }

    th, td {
      padding: 14px 18px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #b30000;
      color: white;
      font-weight: 600;
      font-size: 15px;
    }

    td {
      font-size: 14px;
      color: #333;
    }

    tr:hover {
      background-color: #fff0f0;
      transition: 0.2s ease;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .pending {
      background-color: #ffe066;
      color: #665c00;
    }

    .handled {
      background-color: #caffbf;
      color: #2d6a4f;
    }

    .action-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .edit-btn {
      background-color: #0077b6;
    }

    .edit-btn:hover {
      background-color: #023e8a;
    }

    .delete-btn {
      background-color: #d90429;
      margin-left: 5px;
    }

    .delete-btn:hover {
      background-color: #a50021;
    }

    @media (max-width: 768px) {
      table {
        font-size: 13px;
        min-width: unset;
      }

      th, td {
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <h1>🚨 Emergency Requests</h1>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Serial No</th>
          <th>Requester Name</th>
          <th>Contact Number</th>
          <th>Reason</th>
          <th>Location</th>
          <th>Time</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Sadia Khan</td>
          <td>01711-123456</td>
          <td>Heart Attack</td>
          <td>Room 305, Cardiology</td>
          <td>2025-07-12 10:42 AM</td>
          <td><span class="status pending">Pending</span></td>
          <td>
            <button class="action-btn edit-btn">Edit</button>
            <button class="action-btn delete-btn">Delete</button>
          </td>
        </tr>
        <tr>
          <td>2</td>
          <td>Mehedi Hasan</td>
          <td>01855-987654</td>
          <td>Seizure</td>
          <td>ER Zone</td>
          <td>2025-07-12 11:15 AM</td>
          <td><span class="status handled">Handled</span></td>
          <td>
            <button class="action-btn edit-btn">Edit</button>
            <button class="action-btn delete-btn">Delete</button>
          </td>
        </tr>
        <!-- More emergency requests can be added -->
      </tbody>
    </table>
  </div>

</body>
</html>
