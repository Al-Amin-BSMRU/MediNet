<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Booking</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(to right, #83a4d4, #b6fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .booking-container {
      background-color: #fff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
    }

    .booking-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 15px;
      margin-bottom: 6px;
      color: #333;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #0077ff;
      outline: none;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    .form-group-inline {
      display: flex;
      gap: 15px;
    }

    .form-group-inline .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      background-color: #0077ff;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #005fcc;
    }
  </style>
</head>
<body>

<div class="booking-container">
  <h2>Doctor Appointment Booking</h2>
  <form>
    <div class="form-group">
      <label for="name">Patient Name</label>
      <input type="text" id="name" placeholder="Enter full name" required>
    </div>

    <div class="form-group-inline">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="example@mail.com" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="01XXXXXXXXX" required>
      </div>
    </div>

    <div class="form-group-inline">
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" required>
          <option value="">Select</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Enter age" required>
      </div>
    </div>

    <div class="form-group-inline">
      <div class="form-group">
        <label for="date">Appointment Date</label>
        <input type="date" id="date" required>
      </div>
      <div class="form-group">
        <label for="time">Time</label>
        <input type="time" id="time" required>
      </div>
    </div>

    <div class="form-group">
      <label for="department">Department / Doctor</label>
      <select id="department" required>
        <option value="">Select</option>
        <option value="medicine">Medicine</option>
        <option value="cardiology">Cardiology</option>
        <option value="dermatology">Dermatology</option>
        <option value="surgery">Surgery</option>
      </select>
    </div>

    <div class="form-group">
      <label for="problem">Problem Description</label>
      <textarea id="problem" placeholder="Describe your issue (optional)"></textarea>
    </div>

    <button type="submit">Book Appointment</button>
  </form>
</div>

</body>
</html>
