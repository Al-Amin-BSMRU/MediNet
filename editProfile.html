<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile - Smart Hospital</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ecfcff, #c2e9fb);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .edit-container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
      width: 400px;
      max-width: 90%;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .edit-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #0077b6;
    }

    .edit-container input[type="text"],
    .edit-container input[type="email"],
    .edit-container input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.3s ease;
    }

    .edit-container input:focus {
      border-color: #0077b6;
      outline: none;
      box-shadow: 0 0 5px rgba(0,119,182,0.3);
    }

    .edit-container input[type="submit"] {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #0077b6;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .edit-container input[type="submit"]:hover {
      background: #005f8e;
    }
  </style>
</head>
<body>

  <div class="edit-container">
    <h2>Edit Profile</h2>
    <form>
      <input type="text" placeholder="Enter Your Name" required>
      <input type="email" placeholder="Enter Your Email" required>
      <input type="password" placeholder="Enter New Password" required>
      <input type="submit" value="Save Changes">
    </form>
  </div>

</body>
</html>
